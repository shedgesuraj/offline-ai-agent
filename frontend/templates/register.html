{% extends "base.html" %}{% block content %}
<div class="card auth"><h1>Create account</h1>{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post"><input name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password (6+ chars)" required><button>Register</button></form>
<p><a href="/login">Back to login</a></p></div>{% endblock %}
